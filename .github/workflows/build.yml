name: Build and Sign Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build Unsigned AAB
        run: ./gradlew bundleRelease

      - name: Sign AAB with Upload Key
        uses: r2da/aab-signer-action@v1.0.0
        with:
          aabFile: app/build/outputs/bundle/release/app-release.aab
          keystoreFile: signing.keystore
          keystorePassword: password
          keyAlias: key0
          keyPassword: password

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: app/build/outputs/bundle/release/*.aab
