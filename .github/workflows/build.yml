name: Build and Sign Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build Unsigned AAB
        run: ./gradlew bundleRelease

      - name: Create Keystore & Sign AAB
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias mykeyalias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ObyoTrade, OU=Dev, O=Obyo, L=City, S=State, C=TR" -storepass mysecretpassword -keypass mysecretpassword
          jarsigner -keystore release.keystore -storepass mysecretpassword -keypass mysecretpassword app/build/outputs/bundle/release/app-release.aab mykeyalias

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: app/build/outputs/bundle/release/*.aab
