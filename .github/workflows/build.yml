name: Build Fresh Signed AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Fresh Keystore
        run: |
          keytool -genkeypair -v -keystore fresh-signing.keystore -alias freshkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ObyoTrade, O=Obyo, C=TR" -storepass "ObyoTradePass2026" -keypass "ObyoTradePass2026"

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build Unsigned AAB via Gradle
        run: ./gradlew bundleRelease

      - name: Sign AAB File
        run: |
          AABFILE=$(find . -name "*.aab" | head -n 1)
          echo "Bulunan AAB: $AABFILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore fresh-signing.keystore -storepass "ObyoTradePass2026" -keypass "ObyoTradePass2026" "$AABFILE" freshkey

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: fresh-signed-aab
          path: "**/*.aab"
