name: Build and Sign Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build Unsigned AAB
        run: ./gradlew bundleRelease

      - name: Sign AAB with Keystore
        run: |
          KEYFILE=$(find . -name "signing.keystore" | head -n 1)
          AABFILE=$(find . -name "*.aab" | head -n 1)
          echo "Found Keystore: $KEYFILE"
          echo "Found AAB: $AABFILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYFILE" -storepass "mTZ9w0oYnL31" -keypass "mTZ9w0oYnL31" "$AABFILE" my-key-alias

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: app/build/outputs/bundle/release/*.aab
