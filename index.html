<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Obyo Option — İkili Opsiyon Trading</title>
    <meta name="description" content="Obyo Option — Forex ve OTC varlıklarla profesyonel ikili opsiyon trading platformu." />
    <meta name="keywords" content="obyo option, ikili opsiyon, binary options, forex trading, OTC, opsiyon platformu" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://obyo.io/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://obyo.io/" />
    <meta property="og:title" content="Obyo Option — İkili Opsiyon Trading" />
    <meta property="og:description" content="Forex ve OTC varlıklarla profesyonel ikili opsiyon trading platformu." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Obyo Option" />
    <meta name="twitter:description" content="Profesyonel ikili opsiyon trading platformu." />

    <!-- PWA core -->
    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#000000" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Favicon — logo.jpg (primary, overrides favicon.svg) -->
    <link rel="icon" type="image/jpeg" href="%BASE_URL%logo.jpg" sizes="any" />
    <link rel="shortcut icon" type="image/jpeg" href="%BASE_URL%logo.jpg" />

    <!-- iOS PWA — CRITICAL for home screen icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Obyo Option" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Android / Chrome PWA icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%pwa-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%pwa-icon-512.png" />

    <!-- Structured data — Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Obyo Option",
          "url": "https://obyo.io",
          "logo": "https://obyo.io/logo.jpg",
          "description": "Obyo Option, Forex ve OTC varlıklarla profesyonel ikili opsiyon trading platformudur.",
          "email": "privacy@obyo.io",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "85 Great Portland Street",
            "addressLocality": "London",
            "postalCode": "W1W 7LT",
            "addressCountry": "GB"
          }
        },
        {
          "@type": "WebSite",
          "name": "Obyo Option",
          "url": "https://obyo.io",
          "description": "Forex ve OTC varlıklarla profesyonel ikili opsiyon trading platformu.",
          "inLanguage": "tr"
        }
      ]
    }
    </script>

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
